apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
  labels:
    app: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
      - name: calculator-app
       
        image: praneeth2006racham/kubernetes-calculator:v1.0.0
        ports:
        - containerPort: 80
        stdin: true
        tty: true
