name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    # 1. Source Code & Version Control Stage
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Continuous Integration (CI) Stage
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-node-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest app/test_calculator.py

    # 3. Build & Push Stage (Using a unique tag per commit SHA)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        # Use short commit SHA as a unique tag
        IMAGE_TAG=${{ github.sha }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/kubernetes-calculator:$IMAGE_TAG .
        docker push ${{ secrets.DOCKER_USERNAME }}/kubernetes-calculator:$IMAGE_TAG

    # 4. Deployment Stage
    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        # Replace this with your actual base64 encoded kubeconfig secret if deploying to a remote cluster,
        # or configure your cloud provider CLI credentials here (AWS, GCP, DigitalOcean, etc.)
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

    - name: Update Kubernetes Manifest with Unique Image Tag
      run: |
        IMAGE_TAG=${{ github.sha }}
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/kubernetes-calculator:$IMAGE_TAG|g" k8s/deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
